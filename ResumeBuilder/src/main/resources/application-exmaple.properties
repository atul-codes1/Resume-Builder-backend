spring.application.name=ResumeBuilder

#MongoDB Configuration
spring.data.mongodb.uri=your-mongo-url

#Mail Configuration

spring.mail.host=your-host
spring.mail.port=your-port
spring.mail.username=your-username
spring.mail.password=your-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.from=your-email

#Application Information
app.base.url=http://localhost:8080

#Cloudinary Configuration
cloudinary.cloud-name=your-cloud-name
cloudinary.api-key=your-api-key
cloudinary.api-secret=your-api-secret

#JWT Configuration
jwt.secret=your_secret
jwt.expiration=604800000
#Razorpay Configuration
razorpay.key.id=your-key-id
razorpay.key.secret=your-secret-key

